[project]
name = "hermes-trading"
version = "0.1.0"
description = "Self-improving AI trading agent — powered by Hermes Agent"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0",
    "yfinance>=0.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiofiles>=24.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "rich>=13.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hermes_trading*"]
